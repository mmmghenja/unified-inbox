<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: клавиатура телефона сжимает страницу, а не сдвигает её — шапка и поле ввода на месте.
         viewport-fit=cover: отступы под системные панели телефона приходят в env(safe-area-inset-*) (нижние вкладки,
         шапка), а не угадываются браузером. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
