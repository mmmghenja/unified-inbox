[project]
name = "hub"
version = "1.0.0"
description = "Личный мультимессенджер по проектам"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "telethon==1.45.*",
    "python-socks[asyncio]>=3.1.1",
    "websockets>=15",
    "socksio>=1.0.0",
    "emoji>=2.16.0",
    "mcp>=2.2,<3",
    "aiosmtplib>=5.1",
    "pypdf>=6.19.0",
    # Ф14-9 решение 7: срок и имена сертификата https удалённого слушателя (`core/tls.py`), пара стенда.
    "cryptography>=50",
    "python-multipart>=0.0.32",
    "pillow>=13.0.0",
]

[project.scripts]
hub = "hub.cli:main"
hub-load = "hub.cli:load_main"
# Спека 7c, П2: гард-хук сессии разборщика — лёгкая точка входа (только stdlib, без импорта hub.cli).
# Ф9-1a: грубый гард рабочей сессии — лёгкая точка входа (только stdlib), хук на каждый инструмент.
hub-work-guard = "hub.work.guard:main"
# Ф71-1: хук Cursor для сессий хаба — тонкий клиент сокета хоста (только stdlib), решает хост.
hub-cursor-hook = "hub.work.cursor_hook:main"
# Ф74-5: хук Codex для сессий хаба — тот же тонкий клиент, свой формат ответа.
hub-codex-hook = "hub.work.codex_hook:main"
# Ф74-7/74-3: хук хаба для ВНЕШНИХ окон Codex и Cursor (личность в аргументах MCP, ожидание сигналов).
hub-ext-hook = "hub.ext_hook:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Зависший или зациклившийся тест убивается через 120 с, а не крутится до конца памяти (владелец 14.10).
timeout = 120
# Папка прошедшего теста удаляется сразу после него: временные папки лежат в памяти (tests/conftest.py).
tmp_path_retention_policy = "failed"
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
